<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE BRIDGE · 오늘의 정산</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg-dark:#05070a;
    --felt-green:#0a3d31;
    --gold:#d4af37;
    --gold-light:#f1d592;
    --neon-green:#2ecc71;
    --red:#ff3b30;
    --yellow:#ffd700;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}

  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
                "Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo",sans-serif;
    background:
      radial-gradient(ellipse at top,#0c1118 0%,var(--bg-dark) 55%,#020304 100%);
    color:#e8e8e8;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }

  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 18px;
  }

  /* ── HEADER ───────────────────────────── */
  header{
    text-align:center;
    padding:30px 0 28px;
  }
  .location{
    font-size:11px;
    letter-spacing:4px;
    color:var(--gold);
    opacity:.75;
    font-weight:600;
  }
  .brand{
    font-size:clamp(40px,13vw,58px);
    font-weight:900;
    letter-spacing:2px;
    margin:6px 0 4px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold) 55%,#a37f1d);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:glow 2.8s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 4px rgba(212,175,55,.35));}
    50%{filter:drop-shadow(0 0 16px rgba(212,175,55,.85));}
  }
  .subtitle{
    font-size:13px;
    letter-spacing:3px;
    color:#9fb0a8;
    text-transform:uppercase;
  }
  .subtitle b{color:var(--gold-light);font-weight:700;}

  /* ── SECTIONS ─────────────────────────── */
  section{margin-bottom:28px;}
  .section-title{
    font-size:15px;font-weight:800;color:var(--gold-light);
    letter-spacing:1px;margin:0 0 4px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#1a1206;font-size:12px;font-weight:900;
  }
  .hint{font-size:12px;color:#8a978f;margin:0 0 12px;}

  /* ── MEMBER CHIPS ─────────────────────── */
  .roster-count{
    text-align:center;font-size:13px;color:#aebcb4;margin:0 0 12px;
  }
  .roster-count b{color:var(--neon-green);font-size:17px;font-weight:900;}

  .chip-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  }
  .member-chip{
    position:relative;
    padding:13px 6px;
    border-radius:14px;
    border:1.5px solid rgba(46,204,113,.55);
    background:rgba(46,204,113,.10);
    color:#eafff3;
    font-size:13px;font-weight:700;
    text-align:center;
    cursor:pointer;
    transition:transform .08s ease,background .18s,border-color .18s,color .18s,opacity .18s;
    user-select:none;
    line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;
  }
  .member-chip::before{
    content:"✓";margin-right:4px;font-weight:900;color:var(--neon-green);
  }
  .member-chip:active{transform:scale(.93);}
  .member-chip.out{
    border-color:rgba(150,150,150,.4);
    background:rgba(120,120,120,.10);
    color:#777;
    text-decoration:line-through;
    opacity:.65;
  }
  .member-chip.out::before{content:"✕";color:#888;}

  /* ── EXPENSE ROWS ─────────────────────── */
  .expense-row{
    display:flex;gap:8px;align-items:center;margin-bottom:9px;
  }
  .expense-row input{
    background:rgba(255,255,255,.04);
    border:1.5px solid rgba(212,175,55,.28);
    border-radius:12px;
    color:#f4f4f4;
    padding:12px 13px;
    font-size:14px;
    font-family:inherit;
    transition:border-color .18s,background .18s;
    width:100%;
    min-width:0;
  }
  .expense-row input:focus{
    outline:none;border-color:var(--gold);background:rgba(212,175,55,.06);
  }
  .expense-row .item-name{flex:1.3;}
  .expense-row .item-amount{
    flex:1;text-align:right;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.5px;
  }
  .del-btn{
    flex:0 0 auto;
    width:34px;height:34px;border-radius:10px;border:none;
    background:rgba(255,59,48,.12);color:var(--red);
    font-size:18px;line-height:1;cursor:pointer;
    transition:transform .08s,background .18s;
  }
  .del-btn:active{transform:scale(.9);}

  .add-btn{
    width:100%;margin-top:4px;
    padding:11px;border-radius:12px;
    border:1.5px dashed rgba(212,175,55,.5);
    background:transparent;color:var(--gold-light);
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:transform .08s,background .18s;
  }
  .add-btn:active{transform:scale(.97);}
  .add-btn:hover{background:rgba(212,175,55,.06);}

  .total-line{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:16px;padding-top:14px;
    border-top:1px solid rgba(212,175,55,.25);
  }
  .total-line span{font-size:14px;color:#aebcb4;font-weight:600;}
  .total-line .amt{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:22px;font-weight:900;color:var(--gold);letter-spacing:.5px;
  }

  /* ── ACCOUNT FIELD ────────────────────── */
  .account-field{margin-top:6px;}
  .account-field label{
    display:block;font-size:13px;color:#aebcb4;margin-bottom:6px;font-weight:600;
  }
  .account-field input{
    width:100%;background:rgba(255,255,255,.04);
    border:1.5px solid rgba(212,175,55,.28);border-radius:12px;
    color:#f4f4f4;padding:12px 13px;font-size:14px;font-family:inherit;
  }
  .account-field input:focus{outline:none;border-color:var(--gold);}

  /* ── MAIN BUTTON ──────────────────────── */
  .main-btn{
    width:100%;
    padding:17px;
    border:none;border-radius:60px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,#b8901f);
    color:#1a1206;
    font-size:17px;font-weight:900;letter-spacing:1px;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(212,175,55,.35);
    transition:transform .1s ease,box-shadow .18s;
  }
  .main-btn:active{transform:scale(.96);box-shadow:0 4px 12px rgba(212,175,55,.3);}

  /* ── RESULT CARD (.match-card) ────────── */
  .match-card{
    margin-top:24px;
    background:linear-gradient(160deg,rgba(20,28,24,.95),rgba(8,12,10,.97));
    border:2px solid var(--gold);
    border-radius:20px;
    padding:26px 22px 22px;
    box-shadow:0 0 28px rgba(212,175,55,.22),inset 0 0 22px rgba(0,0,0,.5);
    animation:cardAppear .55s cubic-bezier(.2,.9,.25,1.2);
  }
  @keyframes cardAppear{
    0%{opacity:0;transform:translateY(28px) scale(.94);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  .card-eyebrow{
    text-align:center;font-size:11px;letter-spacing:4px;
    color:var(--gold);opacity:.8;font-weight:700;margin-bottom:6px;
  }
  .per-person-label{text-align:center;font-size:13px;color:#aebcb4;margin-bottom:2px;}
  .per-person{
    text-align:center;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:clamp(44px,15vw,62px);font-weight:900;
    background:linear-gradient(180deg,#9bf5c2,var(--neon-green));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(46,204,113,.55));
    line-height:1.05;
    margin:2px 0 4px;
  }
  .per-person small{font-size:.4em;font-weight:700;color:var(--neon-green);
    -webkit-text-fill-color:var(--neon-green);}
  .remainder-note{
    text-align:center;font-size:12px;color:var(--yellow);margin-bottom:18px;
  }
  .stat-rows{
    border-top:1px solid rgba(212,175,55,.2);
    border-bottom:1px solid rgba(212,175,55,.2);
    padding:12px 0;margin-bottom:16px;
  }
  .stat-rows div{
    display:flex;justify-content:space-between;font-size:14px;padding:5px 0;
  }
  .stat-rows .k{color:#9fb0a8;}
  .stat-rows .v{font-weight:800;color:#f0f0f0;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace;}
  .v.attend{font-family:inherit;color:#8fe0b0;font-weight:400;
    text-align:right;max-width:62%;line-height:1.5;}
  .v.absent{font-family:inherit;color:#cf8a84;font-weight:400;
    text-align:right;max-width:62%;line-height:1.5;}
  .row-stack{align-items:flex-start;}

  /* 눈에 띄는 입금계좌 강조 박스 */
  .pay-account{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:rgba(255,215,0,.12);
    border:1.5px solid var(--yellow);
    border-radius:14px;
    padding:13px 16px;
    margin:6px 0 4px;
  }
  .pay-account .pa-label{font-size:13px;color:#e8dca0;font-weight:800;
    letter-spacing:1px;flex:0 0 auto;}
  .pay-account .pa-value{font-size:14px;font-weight:800;color:var(--yellow);
    text-align:right;word-break:break-all;line-height:1.45;flex:1;}
  .acc-copy{
    flex:0 0 auto;
    width:32px;height:32px;border-radius:9px;
    border:1px solid var(--yellow);
    background:rgba(255,215,0,.15);
    color:var(--yellow);
    font-size:14px;line-height:1;cursor:pointer;
    transition:transform .08s,background .2s,color .2s;
  }
  .acc-copy:active{transform:scale(.9);}
  .acc-copy.done{background:var(--yellow);color:#1a1206;}

  /* 한 줄 띄운 참석/불참 명단 */
  .roster-lists{margin-top:18px;}
  .roster-lists > div{display:flex;justify-content:space-between;
    align-items:flex-start;font-size:14px;padding:5px 0;}
  .roster-lists .k{color:#9fb0a8;font-weight:700;}

  .share-box{
    background:rgba(0,0,0,.4);
    border:1px solid rgba(212,175,55,.25);
    border-radius:12px;
    padding:13px 14px;
    font-size:12.5px;line-height:1.7;color:#cfd8d2;
    white-space:pre-wrap;word-break:break-all;
    margin-bottom:12px;
  }
  .img-btn{
    width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--neon-green);
    background:rgba(46,204,113,.12);color:var(--neon-green);
    font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
    margin-bottom:10px;
    transition:transform .08s,background .2s,color .2s;
  }
  .img-btn:active{transform:scale(.97);}
  .img-btn.done{background:var(--neon-green);color:#04140b;}
  .img-btn:disabled{opacity:.6;cursor:default;}

  .copy-btn{
    width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--neon-green);
    background:rgba(46,204,113,.12);color:var(--neon-green);
    font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
    transition:transform .08s,background .2s,color .2s;
  }
  .copy-btn:active{transform:scale(.97);}
  .copy-btn.done{background:var(--neon-green);color:#04140b;}

  .warn{
    text-align:center;color:var(--red);font-size:14px;font-weight:700;
    background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.35);
    border-radius:14px;padding:16px;margin-top:24px;
    animation:cardAppear .4s ease;
  }

  /* ── FOOTER ───────────────────────────── */
  footer{
    text-align:center;font-size:10.5px;line-height:1.7;
    color:#5f6b64;letter-spacing:.5px;margin-top:36px;
  }
  footer .line1{color:var(--gold);opacity:.6;font-weight:700;letter-spacing:2px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="location">GWANGJU, SOUTH KOREA</div>
    <h1 class="brand">THE BRIDGE</h1>
    <div class="subtitle"><b>오늘의 더치페이(Dutch Pay)</b></div>
  </header>

  <!-- ① 참석자 선택 -->
  <section>
    <h2 class="section-title"><span class="num">1</span> 참석자 선택</h2>
    <p class="hint">※ 불참 회원은 이름을 눌러 제외하세요</p>
    <div class="roster-count">참석 <b id="attendCount">0</b>명</div>
    <div class="chip-grid" id="chipGrid"></div>
  </section>

  <!-- ② 지출 입력 -->
  <section>
    <h2 class="section-title"><span class="num">2</span> 지출 입력</h2>
    <p class="hint">항목명과 금액을 입력하세요. 금액은 자동으로 콤마가 붙습니다.</p>
    <div id="expenseList"></div>
    <button class="add-btn" id="addRow">+ 항목 추가</button>
    <div class="total-line">
      <span>총 지출액</span>
      <span class="amt" id="totalAmt">0원</span>
    </div>
  </section>

  <!-- 입금 계좌 -->
  <section>
    <h2 class="section-title"><span class="num">3</span> 입금 계좌</h2>
    <div class="account-field">
      <label for="account">정산 입금 계좌 (공유 텍스트에 포함됩니다)</label>
      <input type="text" id="account" placeholder="예) 카카오뱅크 3333-00-0000000 백사6000"
             autocomplete="off">
    </div>
  </section>

  <button class="main-btn" id="calcBtn">정산하기 🎱</button>

  <div id="resultArea"></div>

  <footer>
    <div class="line1">© 2025 THE BRIDGE BILLIARDS CLUB</div>
    <div>모든 권한은 더 브릿지 회원님들께 있습니다.</div>
  </footer>

</div>

<script>
/* ════════ 회원 명단 (수정 가능) ════════ */
const members = ["백사6000","려리","kbh5111","발칸VULCAN","지교","무등산1329",
                 "입석대","케이574","그렌다이저","SMG","도유나가즈아","메롱상태"];

/* 기본 지출 항목 */
const DEFAULT_ITEMS = ["게임비","식사비"];

/* ════════ 상태 ════════ */
const attendance = {};               // name -> true(참석)/false(불참)
members.forEach(m => attendance[m] = true);

/* ════════ DOM ════════ */
const chipGrid    = document.getElementById('chipGrid');
const attendCount = document.getElementById('attendCount');
const expenseList = document.getElementById('expenseList');
const totalAmt    = document.getElementById('totalAmt');
const accountInput= document.getElementById('account');
const resultArea  = document.getElementById('resultArea');

/* ════════ 유틸 ════════ */
const fmt = n => n.toLocaleString('ko-KR');           // 천 단위 콤마
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const onlyDigits = s => (s.replace(/[^\d]/g,'') || '');
const parseAmt = s => parseInt(onlyDigits(s) || '0', 10);

/* ════════ ① 회원 칩 ════════ */
function renderChips(){
  chipGrid.innerHTML = '';
  members.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'member-chip' + (attendance[name] ? '' : ' out');
    chip.textContent = name;
    chip.addEventListener('click', () => {
      attendance[name] = !attendance[name];
      chip.classList.toggle('out', !attendance[name]);
      updateCount();
    });
    chipGrid.appendChild(chip);
  });
  updateCount();
}
function getAttendees(){ return members.filter(m => attendance[m]); }
function getAbsentees(){ return members.filter(m => !attendance[m]); }
function updateCount(){ attendCount.textContent = getAttendees().length; }

/* ════════ ② 지출 행 ════════ */
function addExpenseRow(name='', amount=''){
  const row = document.createElement('div');
  row.className = 'expense-row';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'item-name';
  nameInput.placeholder = '항목명';
  nameInput.value = name;

  const amtInput = document.createElement('input');
  amtInput.type = 'text';
  amtInput.inputMode = 'numeric';
  amtInput.className = 'item-amount';
  amtInput.placeholder = '0';
  amtInput.value = amount ? fmt(parseAmt(String(amount))) : '';
  amtInput.addEventListener('input', () => {
    const v = parseAmt(amtInput.value);
    amtInput.value = v ? fmt(v) : '';
    updateTotal(); saveState();
  });

  nameInput.addEventListener('input', saveState);

  const del = document.createElement('button');
  del.className = 'del-btn';
  del.type = 'button';
  del.innerHTML = '&times;';
  del.addEventListener('click', () => { row.remove(); updateTotal(); saveState(); });

  row.append(nameInput, amtInput, del);
  expenseList.appendChild(row);
}

function getExpenses(){
  return [...expenseList.querySelectorAll('.expense-row')].map(r => ({
    name: r.querySelector('.item-name').value.trim(),
    amount: parseAmt(r.querySelector('.item-amount').value)
  }));
}
function getTotal(){ return getExpenses().reduce((s,e)=>s+e.amount,0); }
function updateTotal(){ totalAmt.textContent = fmt(getTotal()) + '원'; }

/* ════════ localStorage ════════ */
const LS_KEY = 'bridge_settlement_v1';
function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      expenses: getExpenses(),
      account: accountInput.value
    }));
  }catch(e){}
}
function loadState(){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  // 지출 항목은 방문할 때마다 항상 기본값으로 초기화
  DEFAULT_ITEMS.forEach(n => addExpenseRow(n, ''));
  // 입금 계좌는 이전 입력값 유지
  if(data && typeof data.account === 'string') accountInput.value = data.account;
}
accountInput.addEventListener('input', saveState);

/* ════════ ③ 정산 ════════ */
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function calculate(){
  const attendees = getAttendees();
  const n = attendees.length;
  const total = getTotal();

  if(n === 0){
    resultArea.innerHTML =
      `<div class="warn">⚠️ 참석자가 없습니다.<br>최소 1명 이상을 선택해 주세요.</div>`;
    resultArea.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(total <= 0){
    resultArea.innerHTML =
      `<div class="warn">⚠️ 지출 금액을 입력해 주세요.</div>`;
    resultArea.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  // 1인당 = 총지출 ÷ 참석자 수 (정수 원, 올림 → 실수금이 총지출보다 적지 않도록)
  const perPerson = Math.ceil(total / n);
  // 잔여 차액: 실제 수금(perPerson×n) - 총지출 (항상 0 이상)
  const collected = perPerson * n;
  const remainder = collected - total;   // 올림 정산으로 발생하는 초과 수금

  const absentees = getAbsentees();
  const absentText = absentees.length ? absentees.join(', ') : '없음';
  const attendText = attendees.length ? attendees.join(', ') : '없음';
  const account = accountInput.value.trim() || '(미입력)';

  let remNote = '딱 나누어떨어집니다 (잔돈 0원)';
  if(remainder > 0)
    remNote = `1인당 올림 정산으로 ${fmt(remainder)}원 더 걷힙니다 (총 +${fmt(remainder)}원)`;

  const shareText =
`🎱 더 브릿지 더치페이 (${todayStr()})
총 지출: ${fmt(total)}원 / 참석 ${n}명 / 1인당: ${fmt(perPerson)}원
참석: ${attendText}
불참: ${absentText}
입금계좌: ${account}`;

  resultArea.innerHTML = `
    <div class="match-card">
      <div class="card-eyebrow">SETTLEMENT RESULT</div>
      <div class="per-person-label">1인당 부담액</div>
      <div class="per-person">${fmt(perPerson)}<small>원</small></div>
      <div class="remainder-note">${remNote}</div>
      <div class="pay-account">
        <span class="pa-label">입금계좌</span>
        <span class="pa-value" id="accValue">${esc(account)}</span>
        <button class="acc-copy" id="accCopyBtn" type="button" aria-label="계좌 복사">📋</button>
      </div>
      <div class="stat-rows">
        <div><span class="k">총 지출액</span><span class="v">${fmt(total)}원</span></div>
        <div><span class="k">참석 인원</span><span class="v">${n}명</span></div>
        <div><span class="k">실수금 합계</span><span class="v">${fmt(collected)}원</span></div>
      </div>
      <div class="roster-lists">
        <div class="row-stack"><span class="k">참석 (${attendees.length}명)</span><span class="v attend">${attendText}</span></div>
        <div class="row-stack"><span class="k">불참 (${absentees.length}명)</span><span class="v absent">${absentText}</span></div>
      </div>
      <div class="share-box" id="shareBox">${shareText.replace(/</g,'&lt;')}</div>
      <button class="img-btn" id="imgBtn">🖼️ 카카오톡 공유 이미지 복사</button>
    </div>`;

  const accCopyBtn = document.getElementById('accCopyBtn');
  accCopyBtn.addEventListener('click', async () => {
    await copyPlainText(account);
    accCopyBtn.classList.add('done');
    accCopyBtn.textContent = '✓';
    setTimeout(() => { accCopyBtn.classList.remove('done'); accCopyBtn.textContent = '📋'; }, 1500);
  });

  document.getElementById('imgBtn').addEventListener('click', async e => {
    const b = e.currentTarget;
    const orig = b.textContent;
    b.disabled = true;
    b.textContent = '🖼️ 이미지 생성 중…';
    try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(_){}
    let canvas;
    try{
      canvas = buildSettlementCanvas({
        date: todayStr(),
        perPerson: fmt(perPerson),
        remNote,
        total: fmt(total) + '원',
        n: n + '명',
        collected: fmt(collected) + '원',
        attendCount: attendees.length,
        absentCount: absentees.length,
        attendText, absentText, account
      });
    }catch(err){ b.textContent = orig; b.disabled = false; return; }
    b.textContent = orig;
    await copyImage(canvas, b);
    b.disabled = false;
  });

  saveState();
  resultArea.scrollIntoView({behavior:'smooth',block:'start'});
}

/* 일반 텍스트 클립보드 복사 */
async function copyPlainText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text); return true;
    }
  }catch(e){ /* 폴백 */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    return true;
  }catch(e){ return false; }
}

/* ════════ 정산서 이미지 생성 (canvas) ════════ */
function buildSettlementCanvas(d){
  const scale = 2, W = 420, pad = 30, cw = W - pad*2;
  const F = {
    brand:'800 30px Pretendard,"Apple SD Gothic Neo",sans-serif',
    sub:'500 14px Pretendard,sans-serif',
    label:'500 15px Pretendard,sans-serif',
    big:'800 56px Pretendard,sans-serif',
    note:'600 13px Pretendard,sans-serif',
    key:'700 15px Pretendard,sans-serif',
    val:'700 15px Pretendard,sans-serif',
    names:'400 14px Pretendard,sans-serif',
    foot:'700 11px Pretendard,sans-serif'
  };
  const mc = document.createElement('canvas').getContext('2d');
  const wrapNames = (t,maxW) => {
    mc.font = F.names; const ps = t.split(', '); const L = []; let c = '';
    for(const p of ps){ const t2 = c ? c+', '+p : p;
      if(mc.measureText(t2).width > maxW && c){ L.push(c); c = p; } else c = t2; }
    if(c) L.push(c); return L.length ? L : ['없음'];
  };
  const wrapChars = (t,maxW) => {
    mc.font = F.names; const L = []; let c = '';
    for(const ch of t){ const t2 = c+ch;
      if(mc.measureText(t2).width > maxW && c){ L.push(c); c = ch; } else c = t2; }
    if(c) L.push(c); return L.length ? L : [''];
  };

  const attendL  = wrapNames(d.attendText, cw);
  const absentL  = wrapNames(d.absentText, cw);
  const accountL = wrapChars(d.account, cw - 28);

  function layout(ctx, draw){
    let y = 30; const cx = W/2;
    const line  = yy => { if(draw){ ctx.strokeStyle='rgba(212,175,55,.28)'; ctx.lineWidth=1;
                          ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(W-pad,yy); ctx.stroke(); } };
    const ctext = (t,f,c,yy) => { if(draw){ ctx.textAlign='center'; ctx.fillStyle=c; ctx.font=f; ctx.fillText(t,cx,yy); } };
    const ltext = (t,f,c,yy) => { if(draw){ ctx.textAlign='left';   ctx.fillStyle=c; ctx.font=f; ctx.fillText(t,pad,yy); } };
    const rtext = (t,f,c,yy) => { if(draw){ ctx.textAlign='right';  ctx.fillStyle=c; ctx.font=f; ctx.fillText(t,W-pad,yy); } };

    ctext('THE BRIDGE', F.brand, '#d4af37', y); y += 38;
    ctext('오늘의 더치페이 · ' + d.date, F.sub, '#9fb0a8', y); y += 30;
    line(y); y += 20;
    ctext('1인당 부담액', F.label, '#aebcb4', y); y += 26;
    ctext(d.perPerson + '원', F.big, '#4fe08a', y); y += 64;   // 눈에 띄는 네온그린
    ctext(d.remNote, F.note, '#ffd700', y); y += 30;

    // 눈에 띄는 입금계좌 강조 박스 (명단 위쪽)
    const accH = 12 + 22 + accountL.length*21 + 8;
    if(draw){
      ctx.fillStyle = 'rgba(255,215,0,.12)';
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(pad, y, cw, accH, 12); else ctx.rect(pad, y, cw, accH);
      ctx.fill(); ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e8dca0'; ctx.font = F.key; ctx.fillText('입금계좌', pad+14, y+12);
      ctx.fillStyle = '#ffd700'; ctx.font = F.val;
      let ay = y + 34;
      for(const l of accountL){ ctx.fillText(l, pad+14, ay); ay += 21; }
    }
    y += accH + 16;
    line(y); y += 16;

    const row = (k,v) => { ltext(k,F.key,'#9fb0a8',y); rtext(v,F.val,'#f0f0f0',y); y += 28; };
    row('총 지출액', d.total);
    row('참석 인원', d.n);
    row('실수금 합계', d.collected);

    y += 16;   // 한 줄 띄움
    ltext('참석 (' + d.attendCount + '명)', F.key, '#2ecc71', y); y += 24;
    for(const l of attendL){ ltext(l, F.names, '#8fe0b0', y); y += 21; }
    y += 10;
    ltext('불참 (' + d.absentCount + '명)', F.key, '#ff6a5e', y); y += 24;
    for(const l of absentL){ ltext(l, F.names, '#cf8a84', y); y += 21; }

    y += 12; line(y); y += 16;
    ctext('© 2025 THE BRIDGE BILLIARDS CLUB', F.foot, 'rgba(212,175,55,.65)', y); y += 22;
    return y + 18;
  }

  const H = Math.ceil(layout(mc, false));
  const canvas = document.createElement('canvas');
  canvas.width = W*scale; canvas.height = H*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.textBaseline = 'top';

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141c18'); g.addColorStop(1,'#080c0a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(4,4,W-8,H-8,18); ctx.stroke(); }
  else ctx.strokeRect(4,4,W-8,H-8);

  layout(ctx, true);
  return canvas;
}

function flashBtn(btn, msg){
  const orig = btn.dataset.orig || btn.textContent;
  btn.dataset.orig = orig;
  btn.classList.add('done');
  btn.textContent = msg;
  setTimeout(() => { btn.classList.remove('done'); btn.textContent = orig; delete btn.dataset.orig; }, 1900);
}

/* 이미지를 클립보드 복사 → (모바일) 공유 시트 → 다운로드 순으로 시도 */
function copyImage(canvas, btn){
  return new Promise(resolve => {
    canvas.toBlob(async blob => {
      if(!blob){ resolve(); return; }
      // 1) 클립보드 이미지 복사
      try{
        if(navigator.clipboard && window.ClipboardItem){
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          flashBtn(btn, '✓ 이미지가 복사되었습니다');
          resolve(); return;
        }
      }catch(e){ /* 폴백으로 진행 */ }
      // 2) 모바일 공유 시트 (카카오톡 직접 공유 가능)
      try{
        const file = new File([blob], 'bridge_dutchpay.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file], title:'더 브릿지 더치페이'}); }
          catch(err){ /* 사용자가 취소 */ }
          resolve(); return;
        }
      }catch(e){ /* 폴백으로 진행 */ }
      // 3) 이미지 파일 다운로드
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'bridge_dutchpay.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      flashBtn(btn, '✓ 이미지가 저장되었습니다');
      resolve();
    }, 'image/png');
  });
}

document.getElementById('calcBtn').addEventListener('click', calculate);

renderChips();

updateTotal();
</script>
